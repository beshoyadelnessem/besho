<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>حلاوة مصر</title>
<style>

  @font-face { font-family: "Reem Kufi"; font-weight: 500; src: url("assets/fonts/ReemKufi-Medium.woff2") format("woff2"); }

  #stage { position: absolute; inset: 0; }
  ::-webkit-scrollbar { display: none; }
  .layer[dir] { direction: rtl; }

  .gold {

      linear-gradient(100deg, transparent 0%, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%, transparent 100%),

  #rule i { display: block; height: 2px; width: 220px; background: linear-gradient(90deg, transparent, var(--gold-2), transparent); transform-origin: center; }
  #rule b { display: block; width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--gold-2); }
  #sub { top: 626px; font-family: "Reem Kufi"; font-weight: 500; font-size: 64px; color: #fbe6bd; letter-spacing: 6px;
         text-shadow: 0 3px 14px rgba(30,12,0,.7); }

<body>
<div id="stage" data-composition-id="helawet-masr" data-duration="5" data-width="1080" data-height="1920">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="title" class="layer" dir="rtl"><span class="word gold" id="w1">حلاوة</span><span class="word gold" id="w2">مصر</span></div>
  <div id="rule" class="layer"><i id="rl"></i><b id="rd"></b><i id="rr"></i></div>
  <div id="sub" class="layer" dir="rtl">أُمّ الدنيا · منذ ٧٠٠٠ عام</div>
  <div id="eng" class="layer">EGYPT</div>
  <div id="fade"></div>

<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }
</script>

<!-- Pass 1: raymarched Giza plateau at sunrise -->
<script id="scene" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 R; uniform float T;
out vec4 o;
#define SUN_COL vec3(1.0,0.62,0.30)

float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p, int n){ float a=.5, s=0.; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<n;i++){ s+=a*vnoise(p); p=m*p; a*=.5; } return s; }

vec3 sunDir(){ float el = radians(mix(3.2, 6.5, T/5.)); float az = radians(-5.0);
  return normalize(vec3(sin(az)*cos(el), sin(el), cos(az)*cos(el))); }

// iq's square pyramid, base [-0.5,0.5]^2, height h
float sdPyramid(vec3 p, float h){
  float m2 = h*h + 0.25;
  p.xz = abs(p.xz); p.xz = (p.z>p.x) ? p.zx : p.xz; p.xz -= 0.5;
  vec3 q = vec3(p.z, h*p.y - 0.5*p.x, h*p.x + 0.5*p.y);
  float s = max(-q.x, 0.0);
  float t = clamp((q.y - 0.5*p.z)/(m2+0.25), 0.0, 1.0);
  float a = m2*(q.x+s)*(q.x+s) + q.y*q.y;
  float b = m2*(q.x+0.5*t)*(q.x+0.5*t) + (q.y-m2*t)*(q.y-m2*t);
  float d2 = min(q.y,-q.x*m2-q.y*0.5) > 0.0 ? 0.0 : min(a,b);
  return sqrt((d2+q.z*q.z)/m2) * sign(max(q.z,-p.y));
}
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float pyr(vec3 p, vec3 c, float base, float hgt, float yaw){
  vec3 q = p - c; q.xz = rot(yaw)*q.xz; return sdPyramid(q/base, hgt/base)*base; }
float pyramids(vec3 p){
  float d = pyr(p, vec3(  0.0,-0.2, 40.0), 23.0, 14.6, 0.55);   // Khufu
  d = min(d, pyr(p, vec3(-27.0,-0.2, 62.0), 21.5, 14.3, 0.55)); // Khafre
  d = min(d, pyr(p, vec3( 19.0,-0.2, 88.0), 10.5,  6.6, 0.55)); // Menkaure
  return d;
}
float terrain(vec2 xz, int oct){
  float d = fbm(xz*0.018 + vec2(3.1,7.7), oct);
  float dunes = 3.2*pow(d, 1.6) - 0.6;
  float ridge = 1.0 - abs(2.0*vnoise(xz*vec2(0.035,0.02)+11.0)-1.0);
  dunes += 0.9*ridge*ridge;
  float dk = min(min(length(xz - vec2(0.0,40.0)) - 14.0, length(xz - vec2(-27.0,62.0)) - 13.0), length(xz - vec2(19.0,88.0)) - 7.0);
  float plateau = smoothstep(4.0, 30.0, dk);
  // keep the camera's corridor low so foreground dunes frame the shot instead of blocking it
  float lane = smoothstep(3.0, 16.0, abs(xz.x + 2.5 + 0.12*(xz.y + 30.0))) + smoothstep(-14.0, 6.0, xz.y);
  dunes = mix(min(dunes, 0.6 + 0.4*dunes), dunes, clamp(lane, 0.0, 1.0));
  return mix(-0.25, dunes, plateau);
}
float map(vec3 p, int oct, out float mat){
  float dp = pyramids(p);
  float dt = (p.y - terrain(p.xz, oct))*0.55;
  mat = dp < dt ? 1.0 : 0.0; return min(dp, dt);
}
vec3 normalAt(vec3 p, float mat){
  vec2 e = vec2(0.02, 0.0); float m;
  vec3 n = normalize(vec3(map(p+e.xyy,6,m)-map(p-e.xyy,6,m), map(p+e.yxy,6,m)-map(p-e.yxy,6,m), map(p+e.yyx,6,m)-map(p-e.yyx,6,m)));
  if (mat < 0.5) { // wind ripples in the sand
    vec2 q = rot(0.35)*p.xz;
    float w = q.y*(2.6 + 1.2*vnoise(p.xz*0.08)) + 4.0*vnoise(p.xz*0.35) + 1.2*vnoise(p.xz*1.7);
    float sl = cos(w)*0.5 + 0.25*cos(w*2.3 + 1.0);
    float fade = smoothstep(70.0, 4.0, length(p.xz - vec2(-2.0,-28.0)));
    float patchy = smoothstep(0.25, 0.75, vnoise(p.xz*0.12 + 4.0));
    n = normalize(n + vec3(0.0, 0.0, -0.32*sl*fade*mix(0.35, 1.0, patchy)) + 0.08*(vec3(vnoise(p.xz*14.0), 0.0, vnoise(p.zx*14.0)) - 0.5));
  } else { // stone courses
    float c = fract(p.y*2.2);
    n = normalize(n + vec3(0.0, 0.35*smoothstep(0.82,1.0,c), 0.0) + 0.06*(vec3(vnoise(p.xy*9.0),0.,vnoise(p.zy*9.0))-0.5));
  }
  return n;
}
float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.15, m;
  for (int i=0;i<40;i++){ float h = map(ro+rd*t, 3, m); res = min(res, 10.0*h/t); t += clamp(h, 0.15, 3.0); if (res<0.002 || t>140.0) break; }
  return clamp(res, 0.0, 1.0);
}
vec3 sky(vec3 rd, vec3 sd){
  float y = max(rd.y, 0.0);
  vec3 zen = vec3(0.012,0.045,0.11), mid = vec3(0.36,0.17,0.16), hor = vec3(1.15,0.48,0.16);
  vec3 c = mix(hor, mid, smoothstep(0.0, 0.09, y)); c = mix(c, zen, smoothstep(0.03, 0.32, y));
  float sdot = max(dot(rd, sd), 0.0);
  c += SUN_COL*(0.30*pow(sdot, 8.0) + 0.7*pow(sdot, 120.0));
  // high streaky clouds lit from below
  vec2 cp = rd.xz/(rd.y+0.08)*1.3 + vec2(T*0.02, 0.0);
  float cl = smoothstep(0.52, 0.85, fbm(cp*vec2(0.6,2.6), 5)) * smoothstep(0.02, 0.2, rd.y) * smoothstep(0.9,0.3,rd.y);
  c = mix(c, vec3(1.0,0.42,0.24)*(0.35+1.5*pow(sdot,6.0)) , cl*0.7);
  c += vec3(9.0,7.0,5.0)*smoothstep(0.99988, 0.99993, sdot); // sun disc
  return c;
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*R)/R.y;
  float k = 1.0 - pow(1.0 - clamp(T/5.0, 0.0, 1.0), 2.2);
  vec3 ro = vec3(mix(1.0, -6.0, k), mix(1.8, 3.4, k), mix(-34.0, -24.0, k));
  vec3 ta = vec3(mix(-2.0, -6.0, k), mix(10.5, 10.8, k), 60.0);
  vec3 fw = normalize(ta-ro), rt = normalize(cross(vec3(0,1,0), fw)), up = cross(fw, rt);
  float roll = radians(mix(-1.2, 0.6, k));
  vec3 rd = normalize(uv.x*(rt*cos(roll)+up*sin(roll)) + uv.y*(up*cos(roll)-rt*sin(roll)) + 1.1*fw);
  vec3 sd = sunDir();

  float t = 0.1, mat = 0.0; bool hit = false;
  for (int i=0;i<180;i++){
    vec3 p = ro + rd*t; float d = map(p, 4, mat);
    if (d < 0.002*t) { hit = true; break; }
    t += d; if (t > 420.0) break;
  }
  vec3 col; float sunVis = 0.0;
  if (hit) {
    vec3 p = ro + rd*t; vec3 n = normalAt(p, mat);
    vec3 alb = mat > 0.5 ? vec3(0.78,0.60,0.40)*(0.82+0.3*vnoise(p.xy*1.7)) : vec3(0.86,0.58,0.34)*(0.9+0.2*vnoise(p.xz*0.3));
    float dif = max(dot(n, sd), 0.0); float sh = dif > 0.0 ? softShadow(p+n*0.05, sd) : 0.0;
    float amb = 0.5 + 0.5*n.y;
    float bounce = max(dot(n, normalize(vec3(-sd.x, -0.3, -sd.z))), 0.0);
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 5.0) * pow(max(dot(rd, sd), 0.0), 8.0) * (mat > 0.5 ? 0.55 : 0.2);
    float fill = max(dot(n, normalize(vec3(0.6, 0.7, -0.5))), 0.0);
    float ao = mat > 0.5 ? mix(0.55, 1.0, smoothstep(0.0, 3.0, p.y)) : mix(0.6, 1.0, smoothstep(0.0, 1.0, pyramids(p)));
    col = alb*ao*(SUN_COL*3.4*dif*sh + vec3(0.16,0.20,0.32)*amb*0.7 + vec3(0.22,0.24,0.34)*fill*0.55 + vec3(0.45,0.25,0.13)*bounce*0.3) + SUN_COL*rim*1.4;
    // aerial perspective with sun in-scatter
    float fog = 1.0 - exp(-t*0.0048);
    vec3 fc = mix(vec3(0.62,0.34,0.22), vec3(1.35,0.68,0.33), pow(max(dot(rd,sd),0.0), 6.0));
    col = mix(col, fc, fog);
  } else {
    col = sky(rd, sd);
    sunVis = smoothstep(0.99975, 0.99993, dot(rd, sd));
  }
  // low ground haze
  col = mix(col, vec3(0.9,0.5,0.3), 0.10*exp(-max(rd.y+0.02,0.0)*28.0));
  // alpha carries the bright light source for the shaft pass
  float bright = sunVis + (hit ? 0.0 : 0.35*pow(max(dot(rd,sd),0.0), 40.0));
  o = vec4(col, bright);
}
</script>

<!-- Pass 2: god rays, bloom, grade, grain, vignette, dust -->
<script id="post" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D S; uniform vec2 R; uniform float T; uniform vec2 SUN;
out vec4 o;
float h11(float n){ return fract(sin(n*127.1)*43758.5453); }
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  // chromatic aberration toward the edges
  vec2 dc = (uv-0.5)*0.0035*length(uv-0.5);
  vec3 col = vec3(texture(S, uv+dc).r, texture(S, uv).g, texture(S, uv-dc).b);
  vec2 px = 1.0/R;
  vec3 cn = texture(S, uv+vec2(0,px.y)).rgb, cs = texture(S, uv-vec2(0,px.y)).rgb, ce = texture(S, uv+vec2(px.x,0)).rgb, cw = texture(S, uv-vec2(px.x,0)).rgb;
  float lc = dot(col, vec3(0.3,0.59,0.11));
  float edge = max(max(abs(dot(cn,vec3(.3,.59,.11))-lc), abs(dot(cs,vec3(.3,.59,.11))-lc)), max(abs(dot(ce,vec3(.3,.59,.11))-lc), abs(dot(cw,vec3(.3,.59,.11))-lc)));
  col = mix(col, (cn+cs+ce+cw+col*2.0)/6.0, smoothstep(0.04, 0.25, edge/(lc+0.2)));
  // volumetric shafts from the sun position
  vec2 dir = (uv - SUN); float ill = 0.0, w = 1.0; vec2 s = uv;
  for (int i=0;i<64;i++){ s -= dir*(1.0/64.0)*0.92; ill += texture(S, s).a * w; w *= 0.95; }
  ill /= 64.0;
  col += vec3(1.0,0.62,0.30) * ill * 1.5;
  // bloom: wide soft taps over highlights
  vec3 b = vec3(0.0); float tw = 0.0;
  for (int i=0;i<48;i++){ float a = float(i)*2.39996; float r = sqrt(float(i)+0.5)*0.0075;
    vec2 off = vec2(cos(a), sin(a)*R.x/R.y)*r; vec3 c = texture(S, uv+off).rgb; b += max(c-1.4, 0.0); tw += 1.0; }
  col += b/tw*0.9;
  // anamorphic streak through the sun
  float streak = exp(-abs(uv.y-SUN.y)*R.y/6.0) * exp(-abs(uv.x-SUN.x)*2.2);
  col += vec3(1.0,0.66,0.38)*streak*0.22;
  // dust motes catching the light
  float t = T;
  for (int i=0;i<28;i++){
    float fi = float(i);
    vec2 p0 = vec2(h11(fi+1.3), h11(fi+7.1));
    float z = 0.4 + 0.6*h11(fi+3.7);
    vec2 p = fract(p0 + vec2(0.012 + 0.02*z, 0.006*sin(fi)) * t + vec2(0.0, 0.004*sin(t*1.3+fi)));
    vec2 d = (uv - p)*vec2(R.x/R.y, 1.0);
    float rad = 0.0016 + 0.006*z*z;
    float m = smoothstep(rad, rad*0.25, length(d));
    float lit = 0.25 + 1.2*exp(-length((p-SUN)*vec2(R.x/R.y,1.0))*3.0);
    col += vec3(1.0,0.78,0.52)*m*lit*0.35*z;
  }
  // grade: exposure ramp, filmic curve, warm highlights / teal shadows
  float expo = mix(0.8, 1.0, smoothstep(0.0, 0.9, T));
  col = aces(col*expo*0.95);
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, col*vec3(0.92,1.0,1.08), (1.0-smoothstep(0.0,0.45,l))*0.6);
  col = mix(col, col*vec3(1.06,1.0,0.9), smoothstep(0.45,1.0,l)*0.5);
  col = smoothstep(0.0, 1.0, col)*0.35 + col*0.65; // gentle S-curve
  col = mix(vec3(dot(col, vec3(0.299,0.587,0.114))), col, 1.12);
  // vignette
  col *= mix(0.62, 1.0, smoothstep(0.0, 0.42, uv.y)); // weight the frame upward
  vec2 q = uv-0.5; col *= 1.0 - 0.55*pow(dot(q*vec2(1.25,0.9), q*vec2(1.25,0.9))*2.2, 1.4);
  // film grain (seeded per frame)
  float g = h21(gl_FragCoord.xy + floor(T*30.0)*vec2(17.0,31.0)) - 0.5;
  col += g*0.045*(1.0-l*0.6);
  o = vec4(clamp(col,0.0,1.0), 1.0);
}
</script>

<script>
(() => {
  const W = 1080, H = 1920;
  const cv = document.getElementById("gl");
  const gl = cv.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
  const src = id => document.getElementById(id).textContent;
  function prog(fs) {
    const p = gl.createProgram();
    for (const [type, s] of [[gl.VERTEX_SHADER, src("vs")], [gl.FRAGMENT_SHADER, src(fs)]]) {
      const sh = gl.createShader(type); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(fs + ": " + gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    }
    gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p); return p;
  }
  const pScene = prog("scene"), pPost = prog("post");
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.getExtension("EXT_color_buffer_float");
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

  // Same camera as the scene shader, used to place the sun on screen for the shaft pass.
  const mix = (a, b, k) => a + (b - a) * k, sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
  const norm = v => { const l = Math.hypot(...v); return v.map(x => x / l); };
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  function sunScreen(T) {
    const k = 1 - Math.pow(1 - Math.min(Math.max(T / 5, 0), 1), 2.2);
    const ro = [mix(1, -6, k), mix(1.8, 3.4, k), mix(-34, -24, k)], ta = [mix(-2, -6, k), mix(10.5, 10.8, k), 60];
    const fw = norm(ta.map((x, i) => x - ro[i])), rt = norm(cross([0, 1, 0], fw)), up = cross(fw, rt);
    const roll = mix(-1.2, 0.6, k) * Math.PI / 180, c = Math.cos(roll), s = Math.sin(roll);
    const rX = rt.map((x, i) => x * c + up[i] * s), uY = up.map((x, i) => x * c - rt[i] * s);
    const el = mix(3.2, 6.5, T / 5) * Math.PI / 180, az = -5 * Math.PI / 180;
    const sd = [Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)];
    const z = dot(sd, fw) / 1.1, ux = dot(sd, rX) / z, uy = dot(sd, uY) / z;
    return [(ux * H + 0.5 * W) / W, (uy * H + 0.5 * H) / H];
  }

  // ---------- typography timeline (pure function of t) ----------
  const $ = id => document.getElementById(id);
  const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 4);
  const easeIO = x => { x = Math.min(Math.max(x, 0), 1); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
  function word(el, t, start, dur) {
    const k = ease((t - start) / dur);
    // right-to-left reveal, blur to sharp, rise and settle
    el.style.clipPath = `inset(-40% ${0}% -40% ${(1 - k) * 100}%)`;
    el.style.opacity = Math.min(1, k * 1.6);
    el.style.transform = `translateY(${(1 - k) * 46}px) scale(${1.08 - 0.08 * k})`;
    el.style.filter = `blur(${(1 - k) * 14}px) drop-shadow(0 6px 18px rgba(40,18,0,.55)) drop-shadow(0 0 30px rgba(255,190,90,.25))`;
    const sweep = easeIO((t - start - dur * 0.55) / 1.4);
    el.style.backgroundPosition = `${130 - sweep * 160}% 0, 0 0`;
  }
  function renderText(t) {
    word($("w1"), t, 0.55, 1.0);
    word($("w2"), t, 0.95, 1.0);
    const titleDrift = 1 + 0.035 * easeIO(t / 5);
    $("title").style.transform = `scale(${titleDrift})`;
    const r = ease((t - 1.75) / 0.9);
    $("rl").style.transform = $("rr").style.transform = `scaleX(${r})`;
    $("rl").style.opacity = $("rr").style.opacity = r;
    $("rd").style.opacity = ease((t - 1.9) / 0.5);
    $("rd").style.transform = `rotate(${45 + (1 - ease((t - 1.9) / 0.7)) * 180}deg)`;
    const s = ease((t - 2.05) / 0.9);
    $("sub").style.opacity = s; $("sub").style.transform = `translateY(${(1 - s) * 22}px)`;
    $("sub").style.letterSpacing = `${6 + (1 - s) * 14}px`;
    const e = ease((t - 2.6) / 1.1);
    $("eng").style.opacity = e * 0.9; $("eng").style.letterSpacing = `${18 + (1 - e) * 22}px`;
    const fin = Math.max(0.35*sstep(0.0, 0.25, 0.25 - t), sstep(4.55, 5.0, t));
    $("fade").style.opacity = Math.max(fin, 0);
  }

  function renderAt(t) {
    gl.viewport(0, 0, W, H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.useProgram(pScene);
    gl.uniform2f(gl.getUniformLocation(pScene, "R"), W, H); gl.uniform1f(gl.getUniformLocation(pScene, "T"), t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.useProgram(pPost);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(gl.getUniformLocation(pPost, "S"), 0);
    gl.uniform2f(gl.getUniformLocation(pPost, "R"), W, H); gl.uniform1f(gl.getUniformLocation(pPost, "T"), t);
    gl.uniform2f(gl.getUniformLocation(pPost, "SUN"), ...sunScreen(t));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    renderText(t);
  }
  window.renderAt = renderAt;
  window.addEventListener("hf-seek", e => renderAt(e.detail.time));
  window.__ready = document.fonts.ready.then(() => renderAt(0));
})();
</script>
