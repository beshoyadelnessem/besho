<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Session Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: a toolbar on top, then the paper form page by page (A4 proportions), scaled to the screen. */
:root {
  --bg: #E9EDEC; --bar: #FFFFFF; --ink: #17211F; --muted: #5E6E6B; --line: #D3DDDA;
  --accent: #0E6E66; --on-accent: #FFFFFF; --rec: #C62828; --pen: #1F2F99; --sheet-shadow: rgba(16, 32, 30, .18);
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1716; --bar: #172321; --ink: #E3ECEA; --muted: #95A9A5; --line: #2A3B38;
  --accent: #3CB7A9; --on-accent: #0F1716; --rec: #F07167; --sheet-shadow: rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1716; --bar: #172321; --ink: #E3ECEA; --muted: #95A9A5; --line: #2A3B38;
  --accent: #3CB7A9; --on-accent: #0F1716; --rec: #F07167; --sheet-shadow: rgba(0, 0, 0, .5); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; white-space: nowrap; }
.btn { font: 600 13px var(--f-ui); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; }
.spacer { flex: 1; }
.hint { font-size: 12px; color: var(--muted); width: 100%; margin: 0; }
.pages { display: grid; justify-items: center; gap: 18px; padding-block: 16px 120px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.page { position: relative; width: 100%; max-width: 794px; box-shadow: 0 2px 14px var(--sheet-shadow); background: #fff; }
.page canvas { display: block; width: 100%; height: auto; }
.page.pen canvas { touch-action: none; cursor: crosshair; }
.mic { position: absolute; transform: translate(0, -50%); width: clamp(24px, 6.4%, 34px); aspect-ratio: 1; height: auto; border-radius: 50%; border: 1.5px solid #0E6E66; background: #E3F3F0; color: #0E6E66;
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.mic svg { width: 58%; height: 58%; }
.mic.on { background: #C62828; border-color: #C62828; color: #fff; }
@media (prefers-reduced-motion: no-preference) { .mic.on { animation: pulse 1s infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(198, 40, 40, .2); } } }
.pageno { position: absolute; top: -16px; right: 0; font-size: 11px; color: var(--muted); }
/* bottom sheet editor */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px var(--sheet-shadow);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 8px; max-width: 820px; margin: 0 auto; border-radius: 14px 14px 0 0; }
.sheet h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.sheet textarea, .sheet input { width: 100%; font: 16px var(--f-ui); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sheet textarea { min-height: 96px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.fields label { display: grid; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.warn { font-size: 12.5px; color: var(--rec); margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bar); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 30; }
</style>

<div class="bar" id="bar">
  <h1>Session sheet</h1>
  <div class="seg" role="group" aria-label="Writing mode">
    <button class="btn" id="mode-type" type="button" aria-pressed="true">Speak / type</button>
    <button class="btn" id="mode-pen" type="button" aria-pressed="false">Pen</button>
  </div>
  <button class="btn" id="undo" type="button" hidden>Undo stroke</button>
  <span class="spacer"></span>
  <button class="btn" id="copy" type="button">Copy text</button>
  <button class="btn primary" id="pdf" type="button">PDF</button>
  <button class="btn" id="new" type="button">New sheet</button>
  <p class="hint" id="hint">Tap a microphone and speak, or tap any line to type. Switch to Pen to write by hand.</p>
</div>
<div class="pages" id="pages"></div>

<div class="sheet" id="editor" hidden role="dialog" aria-labelledby="ed-title">
  <h2 id="ed-title">Examination</h2>
  <div id="ed-body"></div>
  <p class="note" id="ed-note"></p>
  <div class="row">
    <button class="btn" type="button" id="ed-mic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg><span id="ed-mic-label">Speak</span></button>
    <span class="spacer"></span>
    <button class="btn" type="button" id="ed-clear">Clear this part</button>
    <button class="btn primary" type="button" id="ed-done">Done</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ---------------------------------------------------------------------------
// The form (empty), drawn on canvas page by page. Sizes in page pixels (A4 = 794 x 1123).
// ---------------------------------------------------------------------------
const PW = 794, PH = 1123, M = 40, CW = PW - 2 * M, L = 30, HEADER_H = 150, FOOT_H = 96;
const MIC_SCREEN = 56, MIC_PRINT = 8;   // room kept after a label for the mic button (none in the PDF)
const HAND = '25px Caveat, "Segoe Print", cursive', LABEL = 'bold 14px Arial, "Helvetica Neue", sans-serif';
const INK = { blue: '#1F2F99', black: '#1B1B1B' };
const SECS = [
  { id: 'date', name: 'Date', min: 1 },
  { id: 'exam', name: 'Examination', label: 'Examination:', own: true, min: 7 },
  { id: 'tx', name: 'Medical treatment', label: 'Medical treatment:', min: 4 },
  { id: 'rehab', name: 'Rehabilitation', label: 'Rehabilitation:', min: 8 },
  { id: 'follow', name: 'Follow up', label: 'Follow up:', min: 3 },
];
const HEADER_FIELDS = [['name', 'Patient Name'], ['mrn', 'Medical Record No.'], ['adm', 'Admission Date'], ['phys', 'Attending physician'], ['spec', 'Specialty'], ['unit', 'Unit / ward'], ['room', 'Room / Bed No.']];

const store = {
  get(k, d) { try { const v = localStorage.getItem('vss.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vss.' + k, JSON.stringify(v)); } catch { /* storage blocked */ } },
};
const todayText = () => { const d = new Date(); return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };
const blank = () => ({ foot: { title: 'Physician', name: '', date: '', time: '', ink: [] }, header: {}, clinic: store.get('clinic', { name: '', code: '' }),
  secs: Object.fromEntries(SECS.map((s) => [s.id, { text: s.id === 'date' ? todayText() : '', ink: [], extra: 0 }])), order: [] });
let doc = store.get('draft', null) || blank();
doc.foot = doc.foot || { title: 'Physician', name: '', date: '', time: '', ink: [] };
for (const s of SECS) doc.secs[s.id] = doc.secs[s.id] || { text: '', ink: [], extra: 0 };
let mode = 'type', penColor = 'blue', layout = null;
const save = () => store.set('draft', doc);

// text measuring with the handwriting face
const mctx = document.createElement('canvas').getContext('2d');
function labelW(t) { mctx.font = LABEL; return mctx.measureText(t + ' ').width; }
function wrap(text, first, rest) {
  mctx.font = HAND; const lines = [];
  for (const para of String(text || '').split('\n')) {
    let cur = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const width = lines.length ? rest : first; const tryLine = cur ? cur + ' ' + w : w;
      if (mctx.measureText(tryLine).width <= width || !cur) cur = tryLine; else { lines.push(cur); cur = w; }
    }
    lines.push(cur);
  }
  return lines.length === 1 && lines[0] === '' ? [] : lines;
}

// Lay the sections out on ruled rows, page after page.
function computeLayout(MIC_W = MIC_SCREEN) {
  const pages = [{ rows: [], first: true }]; let y = M + HEADER_H;
  const bottom = PH - M;
  const next = () => { pages.push({ rows: [], first: false }); y = M + 34; };
  const mics = [];
  for (const s of SECS) {
    const st = doc.secs[s.id];
    if (s.id === 'date') {
      if (y + L > bottom) next();
      mctx.font = HAND; const w = mctx.measureText(st.text || ' ').width;
      pages.at(-1).rows.push({ sec: 'date', r: 0, y, kind: 'date', text: st.text });
      // keep the date mic clear of the Examination mic just below it
      mics.push({ sec: 'date', page: pages.length - 1, x: M + Math.max(w + 12, labelW('Examination:') + MIC_W + 16), y: y + L / 2 });
      y += L; continue;
    }
    const lw = s.own ? 0 : labelW(s.label);
    if (s.own) {
      if (y + L > bottom) next();
      pages.at(-1).rows.push({ sec: s.id, r: -1, y, kind: 'label', label: s.label });
      mics.push({ sec: s.id, page: pages.length - 1, x: M + labelW(s.label) + 4, y: y + L / 2 });
      y += L;
    }
    const firstW = s.own ? CW : CW - lw - MIC_W;
    const lines = wrap(st.text, firstW, CW);
    const inkRows = st.ink.reduce((m, k) => Math.max(m, ...k.pts.map((p) => Math.floor(p[1] / L) + 1)), 0);
    const n = Math.max(s.min, lines.length, inkRows) + st.extra;
    for (let r = 0; r < n; r++) {
      if (y + L > bottom) next();
      const row = { sec: s.id, r, y, kind: 'row', text: lines[r] || '', x: M + (r === 0 && !s.own ? lw + MIC_W : 0) };
      if (r === 0 && !s.own) { row.label = s.label; mics.push({ sec: s.id, page: pages.length - 1, x: M + lw, y: y + L / 2 }); }
      pages.at(-1).rows.push(row); y += L;
    }
  }
  if (y + FOOT_H + 10 > bottom) next();
  pages.at(-1).footY = y + 14;
  return { pages, mics };
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function drawPage(ctx, page, i, total) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH);
  ctx.textBaseline = 'alphabetic';
  if (page.first) drawHeader(ctx); else { ctx.font = '11px Arial'; ctx.fillStyle = '#666'; ctx.fillText(`Session sheet, continued (page ${i + 1})`, M, M + 14); }
  for (const row of page.rows) {
    if (row.kind === 'row') {           // dotted rule
      ctx.fillStyle = '#7A7A7A';
      for (let x = M; x < PW - M; x += 4) ctx.fillRect(x, row.y + L - 5, 1.4, 1.4);
    }
    if (row.label) { ctx.font = LABEL; ctx.fillStyle = '#1A1A1A'; ctx.fillText(row.label, M, row.y + L - 9); }
    if (row.text) { ctx.font = HAND; ctx.fillStyle = INK.blue; ctx.fillText(row.text, row.kind === 'date' ? M : row.x, row.y + L - 9); }
  }
  // ink, in section coordinates
  const rowsOf = {}; for (const row of page.rows) if (row.kind === 'row') (rowsOf[row.sec] ||= {})[row.r] = row;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of SECS) {
    const map = rowsOf[s.id]; if (!map) continue;
    for (const k of doc.secs[s.id].ink) {
      ctx.strokeStyle = INK[k.c] || INK.blue; ctx.lineWidth = 2.2; let open = false; ctx.beginPath();
      for (const [x, ys] of k.pts) {
        const row = map[Math.floor(ys / L)];
        if (!row) { open = false; continue; }
        const py = row.y + (ys - row.r * L);
        if (open) ctx.lineTo(x, py); else { ctx.moveTo(x, py); open = true; }
      }
      ctx.stroke();
    }
  }
  if (page.footY != null) drawFooter(ctx, page.footY);
  if (total > 1) { ctx.font = '10px Arial'; ctx.fillStyle = '#888'; ctx.textAlign = 'right'; ctx.fillText(`${i + 1} / ${total}`, PW - M, PH - 18); ctx.textAlign = 'left'; }
}
function drawHeader(ctx) {
  const h = doc.header;
  ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.4; ctx.strokeRect(M, M, 420, 124);
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText('ADDRESSOGRAPH :', M + 10, M + 18);
  let y = M + 36;
  const dots = (x1, x2, yy) => { ctx.fillStyle = '#888'; for (let x = x1; x < x2; x += 3) ctx.fillRect(x, yy, 1, 1); };
  for (const [k, label] of HEADER_FIELDS.slice(0, 5)) {
    ctx.font = 'bold 10.5px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText(label + ' :', M + 10, y);
    const lx = M + 10 + ctx.measureText(label + ' : ').width; dots(lx, M + 410, y + 1);
    if (h[k]) { ctx.font = '19px Caveat, cursive'; ctx.fillStyle = INK.blue; ctx.fillText(h[k], lx + 4, y - 1); }
    y += 15.5;
  }
  ctx.font = 'bold 10.5px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText('Unit / ward :', M + 10, y);
  let lx = M + 10 + ctx.measureText('Unit / ward : ').width; dots(lx, M + 200, y + 1);
  if (h.unit) { ctx.font = '19px Caveat, cursive'; ctx.fillStyle = INK.blue; ctx.fillText(h.unit, lx + 4, y - 1); }
  ctx.font = 'bold 10.5px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText('Room / Bed No. :', M + 210, y);
  lx = M + 210 + ctx.measureText('Room / Bed No. : ').width; dots(lx, M + 410, y + 1);
  if (h.room) { ctx.font = '19px Caveat, cursive'; ctx.fillStyle = INK.blue; ctx.fillText(h.room, lx + 4, y - 1); }
  const rx = M + 450;
  if (doc.clinic.name) { ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText(doc.clinic.name.toUpperCase(), rx, M + 22); }
  ctx.font = 'bold 21px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.fillText('PHYSICAL MEDICINE', rx, M + 56);
  ctx.font = '17px Arial'; ctx.fillText('RHEUMATOLOGY &', rx, M + 78); ctx.fillText('REHABILITATION', rx, M + 99);
}
const FOOT_COLS = [0, 150, 310, 490, 600, CW], FOOT_HH = 30, FOOT_RH = 38;
function fitText(ctx, t, x, y, w) { let size = 21; while (size > 12) { ctx.font = `${size}px Caveat, cursive`; if (ctx.measureText(t).width <= w) break; size -= 1; } ctx.fillText(t, x, y); }
const inFoot = (pi, y) => layout.pages[pi].footY != null && y >= layout.pages[pi].footY && y <= layout.pages[pi].footY + FOOT_HH + FOOT_RH;
function drawFooter(ctx, y) {
  const cols = FOOT_COLS, hh = FOOT_HH, rh = FOOT_RH;
  ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.2; ctx.strokeRect(M, y, CW, hh + rh);
  ctx.beginPath(); ctx.moveTo(M, y + hh); ctx.lineTo(M + CW, y + hh);
  for (const c of cols.slice(1, -1)) { ctx.moveTo(M + c, y); ctx.lineTo(M + c, y + hh + rh); }
  ctx.stroke();
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#1A1A1A'; ctx.textAlign = 'center';
  ['TITLE', 'NAME', 'SIGNATURE', 'DATE', 'TIME'].forEach((t, i) => ctx.fillText(t, M + (cols[i] + cols[i + 1]) / 2, y + 20));
  const f = doc.foot;
  ctx.textAlign = 'left'; ctx.fillText(f.title || 'Physician', M + 8, y + hh + 24);
  ctx.font = '21px Caveat, cursive'; ctx.fillStyle = INK.blue;
  [[1, f.name], [3, f.date], [4, f.time]].forEach(([i, t]) => { if (t) fitText(ctx, t, M + cols[i] + 8, y + hh + 26, cols[i + 1] - cols[i] - 14); });
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const k of f.ink) { ctx.strokeStyle = INK[k.c] || INK.blue; ctx.lineWidth = 2; ctx.beginPath();
    k.pts.forEach(([x, yy], j) => (j ? ctx.lineTo(x, y + yy) : ctx.moveTo(x, y + yy))); ctx.stroke(); }
  ctx.fillStyle = '#1A1A1A';
  if (doc.clinic.code) { ctx.font = 'bold 10px Arial'; ctx.textAlign = 'right'; ctx.fillText(doc.clinic.code, PW - M, y + hh + rh + 14); ctx.textAlign = 'left'; }
}

const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>';
function render() {
  layout = computeLayout();
  const host = document.getElementById('pages');
  const total = layout.pages.length;
  while (host.children.length > total) host.lastChild.remove();
  layout.pages.forEach((page, i) => {
    let el = host.children[i];
    if (!el) { el = document.createElement('div'); el.className = 'page'; el.innerHTML = '<canvas></canvas>'; host.append(el); bindCanvas(el.querySelector('canvas'), i); }
    el.classList.toggle('pen', mode === 'pen');
    el.querySelector('canvas').dataset.page = i;
    const cv = el.querySelector('canvas'); const scale = Math.min(3, (window.devicePixelRatio || 1) * Math.max(1, el.clientWidth / PW || 1));
    cv.width = Math.round(PW * scale); cv.height = Math.round(PH * scale);
    const ctx = cv.getContext('2d'); ctx.setTransform(scale, 0, 0, scale, 0, 0); drawPage(ctx, page, i, total);
    el.querySelectorAll('.mic, .pageno').forEach((m) => m.remove());
    if (total > 1) { const n = document.createElement('span'); n.className = 'pageno'; n.textContent = `Page ${i + 1} of ${total}`; el.append(n); }
    for (const m of layout.mics.filter((x) => x.page === i)) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mic' + (voice.active === m.sec ? ' on' : '');
      b.dataset.mic = m.sec; b.setAttribute('aria-label', `Speak into ${SECS.find((s) => s.id === m.sec).name}`); b.innerHTML = MIC_SVG;
      b.style.left = `${(m.x / PW) * 100}%`; b.style.top = `${(m.y / PH) * 100}%`; el.append(b);
    }
  });
  save();
}

// ---------------------------------------------------------------------------
// Tap to type, pen to write
// ---------------------------------------------------------------------------
const toPage = (cv, e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * PW, ((e.clientY - r.top) / r.height) * PH]; };
const rowAt = (pi, y) => layout.pages[pi].rows.find((row) => y >= row.y && y < row.y + L);
function bindCanvas(cv) {
  let stroke = null, sec = null;
  cv.addEventListener('pointerdown', (e) => {
    const pi = +cv.dataset.page; const [x, y] = toPage(cv, e);
    if (mode === 'type') {
      if (layout.pages[pi].first && y < M + HEADER_H - 10) return openEditor('header');
      if (inFoot(pi, y)) return openEditor('foot');
      const row = rowAt(pi, y); if (row) openEditor(row.sec);
      return;
    }
    if (inFoot(pi, y)) {
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      sec = 'foot'; stroke = { c: penColor, pts: [[x, y - layout.pages[pi].footY]] }; doc.foot.ink.push(stroke); doc.order.push('foot'); return;
    }
    const row = rowAt(pi, y); if (!row || row.kind !== 'row') return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    sec = row.sec; stroke = { c: penColor, pts: [[x, row.r * L + (y - row.y)]] };
    doc.secs[sec].ink.push(stroke); doc.order.push(sec);
  });
  cv.addEventListener('pointermove', (e) => {
    if (!stroke) return; const pi = +cv.dataset.page; const [x, y] = toPage(cv, e);
    if (sec === 'foot') { const fy = layout.pages[pi].footY; stroke.pts.push([Math.max(M, Math.min(PW - M, x)), Math.max(0, Math.min(FOOT_HH + FOOT_RH, y - fy))]); return redraw(pi); }
    const row = rowAt(pi, y);
    if (row && row.sec === sec && row.kind === 'row') stroke.pts.push([x, row.r * L + (y - row.y)]);
    redraw(pi);
  });
  const end = () => {
    if (!stroke) return;
    if (sec === 'foot') { stroke = null; sec = null; render(); return refreshUndo(); }
    // writing on the last line of a part opens one more line (the sheet grows onto a new page if needed)

  'edema', 'effusion', 'hyperalgesia', 'allodynia', 'paresthesia', 'numbness', 'tenderness', 'crepitus', 'stiffness', 'spasm', 'weakness', 'proprioception', 'kinesthesia',
  'dorsiflexion', 'plantar flexion', 'eversion', 'inversion', 'pronation', 'supination', 'abduction', 'adduction', 'extension', 'flexion', 'rotation', 'side bending', 'circumduction',
  'isometric', 'isotonic', 'concentric', 'eccentric', 'stabilization', 'rhythmic', 'clamshell', 'quadruped', 'supine', 'prone', 'theraband', 'proprioceptive', 'plyometric',
  'semispinalis', 'ULTT', 'Spurling', 'Lachman', 'McMurray', 'FABER', 'FADIR', 'Phalen', 'Tinel', 'Finkelstein', 'Thomas test', 'slump test', 'empty can', 'Hawkins Kennedy',
  'scapular dyskinesis', 'SLR', 'TKE', 'OKC', 'CKC', 'PROM', 'AROM', 'ROM', 'HEP', 'SAQ', 'LAQ', 'NWB', 'PWB', 'FWB', 'WBAT', 'PNF', 'STM', 'MFR', 'ITB', 'TFL', 'ACL', 'PCL', 'MCL', 'MMT'];
const PT_VOCAB = ['dipole', '2 pole', 'russian', 'cryo', 'laser', 'phonophoresis', 'betaderm', 'mwm', 'mulligan', 'snag', 'nags', 'met', 'ndt', 'periscapular', 'suboccipital',
  'tl fascia', 'pf mobilization', 'lymphatic', 'quads', 'hamst', 'glute', 'semispinalis', 'scalene', 'levator', 'multifidus', 'tra', 'cervicodorsal', 'dorsolumbar', 'tfcc',
  'pip', 'dip', 'edema', 'hyperalgesia', 'ultt', 'spurling', 'proprioception', 'slr', 'tke', 'okc', 'ckc', 'clamshell', 'quadruped', 'supine', 'prone', 'theraband',
  'isometric', 'concentric', 'prom', 'rom', 'ir, er', 'abd, add', 'traction', 'mobilization', 'stabilization', 'tenderness', 'limited', 'weakness'];
let ptShort = store.get('ptShort', true);
const ptUser = store.get('fixes', []);   // [{heard, should}]
const escRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function ptFix(text) {
  let t = String(text || '');
  for (const [re, to] of PT_FIX) t = t.replace(re, to);
  if (ptShort) for (const [re, to] of PT_SHORT) t = t.replace(re, to);
  for (const f of ptUser) if (f.heard) t = t.replace(new RegExp(`\\b${escRe(f.heard)}\\b`, 'gi'), f.should);
  return t.replace(/[ \t]+/g, ' ').replace(/ ([,.])/g, '$1').replace(/\/ \//g, '/').trim();
}
// When the speech service offers several guesses, keep the one with the most clinic words.
// scored on the raw guess, so a guess that already has the right words wins over one that only gets fixed later
function ptScore(t) { const x = ` ${String(t).toLowerCase()} `; return PT_VOCAB.reduce((n, w) => n + (x.includes(` ${w}`) ? 1 : 0), 0); }
const COMMON = new Set('the and for with from then this that have has was were are with into onto over under after before right left both side knee hip neck back hand wrist foot ankle leg arm min minute minutes sets set reps exs ex exercise exercises short arc lever long full range of motion no not on in at to up down patient home pain session day week times every each'.split(' '));
function soundKey(w) {
  let x = w.toLowerCase().replace(/[^a-z]/g, ''); if (!x) return '';
  x = x.replace(/^(kn|gn|pn|ps)/, 'n').replace(/^wr/, 'r').replace(/^x/, 's').replace(/ph/g, 'f').replace(/ck/g, 'k').replace(/sch/g, 'sk').replace(/(sh|ch|tio|tia)/g, 'x')
    .replace(/th/g, '0').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k').replace(/q/g, 'k').replace(/x/g, 'ks').replace(/z/g, 's').replace(/dg(?=[eiy])/g, 'j')
    .replace(/g(?=[eiy])/g, 'j').replace(/gh/g, '').replace(/v/g, 'f').replace(/d/g, 't').replace(/y(?![aeiou])/g, '').replace(/w(?![aeiou])/g, '');
  return (x[0] + x.slice(1).replace(/[aeiouhyw]/g, '')).replace(/(.)\1+/g, '$1');
}
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
const TERM_KEYS = PT_TERMS.filter((t) => t.replace(/[^a-z]/gi, '').length >= 6 && t !== t.toUpperCase()).map((t) => ({ t, k: soundKey(t), n: t.toLowerCase().replace(/[^a-z]/g, '') }));
const KNOWN = new Set(PT_TERMS.map((t) => t.toLowerCase()));
// Returns [{from, to}] for words (or 2-3 word runs) that sound like a clinic term but are not one.
function ptSuggest(text) {
  const words = String(text || '').split(/[^A-Za-z']+/).filter(Boolean); const out = []; const seen = new Set();
  for (let n = 3; n >= 1; n--) for (let i = 0; i + n <= words.length; i++) {
    const run = words.slice(i, i + n); const from = run.join(' '); const flat = from.toLowerCase().replace(/[^a-z]/g, '');
    if (flat.length < 5 || run.every((w) => COMMON.has(w.toLowerCase())) || KNOWN.has(from.toLowerCase()) || seen.has(from.toLowerCase())) continue;
    if (n === 1 && (COMMON.has(flat) || KNOWN.has(flat))) continue;
    const k = soundKey(flat);
    let best = null;
    for (const c of TERM_KEYS) {
      if (c.n === flat) { best = null; break; }
      const kd = lev(k, c.k), sd = lev(flat, c.n);
      if (kd <= (c.k.length >= 6 ? 1 : 0) && sd <= Math.max(2, Math.floor(c.n.length * 0.4)) && (!best || sd < best.sd)) best = { to: c.t, sd };
    }
    if (best) { out.push({ from, to: best.to }); seen.add(from.toLowerCase()); }
  }
  return out.filter((s, i) => !out.some((o, j) => j !== i && o.from.length > s.from.length && o.from.toLowerCase().includes(s.from.toLowerCase()))).slice(0, 6);
}
function bestAlt(result) { let best = result[0]; for (let i = 1; i < result.length; i++) if (ptScore(result[i].transcript) > ptScore(best.transcript)) best = result[i]; return best.transcript; }

const voice = (() => {
  let framed = true; try { framed = window.self !== window.top; } catch { framed = true; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const v = { framed, active: null, busy: '', mode: framed ? 'none' : SR ? 'service' : (navigator.mediaDevices?.getUserMedia && window.MediaRecorder ? 'device' : 'none') };
  v.label = () => (v.mode === 'device' ? 'Record' : 'Speak');
  let rec = null, recorder = null, stream = null, chunks = [], asr = null, base = '';
  const setText = (sec, t) => { doc.secs[sec].text = t; const box = editing === sec ? $('#ed-text') : null; if (box) box.value = t; render(); suggSoon(); };
  const note = (t, warn) => { const n = $('#ed-note'); n.textContent = t; n.className = warn ? 'warn' : 'note'; };
  const finish = () => { v.active = null; v.busy = ''; render(); syncEdMic(); };
  v.start = (sec) => {
    if (v.active) v.stop();
    v.active = sec; base = doc.secs[sec].text.trim(); render(); syncEdMic();
    return v.mode === 'service' ? startService(sec) : startDevice(sec);
  };
  v.stop = () => { if (rec) { const r = rec; rec = null; try { r.stop(); } catch { /* stopped */ } finish(); } else if (recorder) recorder.stop(); else finish(); };
  v.toggle = (sec) => { if (v.framed || v.mode === 'none') return note('The page cannot open the microphone here. Tap the box, then the microphone on your keyboard.', true); return v.active === sec ? v.stop() : v.start(sec); };
  const PERM = 'Chrome has the microphone off for this page: tap the icon at the left of the address bar → Permissions → Microphone → Allow, then reload. If you opened the link inside WhatsApp, open it in Chrome or Safari.';
  function startService(sec) {
    rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
    let got = false; const mine = rec; note('Listening… speak, then tap the microphone again to stop.');
    rec.onresult = (ev) => { got = true; let fin = '', mid = '';
      for (let i = 0; i < ev.results.length; i++) (ev.results[i].isFinal ? (fin += bestAlt(ev.results[i]) + ' ') : (mid += ev.results[i][0].transcript));
      setText(sec, [base, ptFix(fin), ptFix(mid)].filter(Boolean).join(' ')); };
    rec.onerror = (ev) => {
      if (rec !== mine) return; rec = null; try { mine.abort(); } catch { /* ignore */ }
      if (ev.error === 'not-allowed') note(PERM, true);
      else if (ev.error === 'service-not-allowed' || ev.error === 'network' || ev.error === 'language-not-supported') { v.mode = 'device'; note('This browser’s speech service is not available. Tap the microphone again to record instead.', true); }
      else if (ev.error !== 'no-speech' && ev.error !== 'aborted') note(`The microphone stopped (${ev.error}). Try again.`, true);
      finish();
    };
    rec.onend = () => { if (rec === mine) { rec = null; finish(); note('Done. Tap the microphone to add more.'); } };
    setTimeout(() => { if (rec === mine && !got) { rec = null; try { mine.abort(); } catch { /* ignore */ } v.mode = 'device'; finish(); note('The speech service did not answer. Tap the microphone again to record instead.', true); } }, 7000);
    try { rec.start(); } catch { rec = null; v.mode = 'device'; finish(); }
  }
  async function loadAsr() {
    if (asr) return asr;
    const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
    asr = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en'); return asr;
  }
  async function startDevice(sec) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { finish(); return note(e?.name === 'NotFoundError' ? 'No microphone was found.' : PERM, true); }
    loadAsr().catch(() => {});
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = async () => {
      stream?.getTracks().forEach((t) => t.stop()); recorder = null; v.busy = 'Writing…'; render(); syncEdMic();
      note('Turning your voice into text on this phone (the first time downloads about 40 MB)…');
      try {
        const buf = await new Blob(chunks).arrayBuffer();
        const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const audio = (await ctx.decodeAudioData(buf)).getChannelData(0); ctx.close?.();
        const out = await (await loadAsr())(audio, { chunk_length_s: 30 });
        const t = String(out?.text || '').trim();
        if (t) { setText(sec, [base, ptFix(t)].filter(Boolean).join(' ')); note('Done. Tap the microphone to add more.'); } else note('Nothing was heard. Try again closer to the phone.', true);
      } catch { note('Could not turn the recording into text here (the voice model needs internet the first time). Use the keyboard microphone.', true); }
      finish();
    };
    recorder.start(); note('Recording… speak, then tap the microphone again to stop.');
  }
  return v;
})();

function say(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => { el.hidden = true; }, 2400); }
function sheetText() {
  const h = doc.header; const out = [];
  const who = HEADER_FIELDS.filter(([k]) => h[k]).map(([k, l]) => `${l}: ${h[k]}`); if (who.length) out.push(...who, '');
  out.push(doc.secs.date.text);
  for (const s of SECS.slice(1)) { out.push('', s.label); out.push(doc.secs[s.id].text || (doc.secs[s.id].ink.length ? '(handwritten)' : '—')); }
  const f = doc.foot; out.push('', [f.title || 'Physician', f.name, f.ink.length ? '(signed)' : '', f.date, f.time].filter(Boolean).join('  ·  '));
  return out.join('\n');
}
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText(sheetText()); say('Copied.'); } catch { say('Copy is blocked here.'); } };
let downloadsFn = null;
async function makePdf() {
  if (!window.jspdf) return say('PDF tool did not load. Check the internet and reload.');
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const printed = computeLayout(MIC_PRINT);
  printed.pages.forEach((page, i) => {
    const cv = document.createElement('canvas'); cv.width = PW * 2; cv.height = PH * 2;
    const ctx = cv.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0); drawPage(ctx, page, i, printed.pages.length);
    if (i) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 595.28, 841.89);
  });
  const name = `session-sheet-${(doc.header.name || 'patient').replace(/[^\w-]+/g, '-')}-${doc.secs.date.text.replace(/\//g, '-')}.pdf`;
  const blob = pdf.output('blob');
  if (downloadsFn) { try { await downloadsFn.save({ filename: name, data: blob }); say('PDF saved.'); } catch (e) { say(e?.code === 'declined' ? 'Cancelled.' : 'Download is not available here.'); } return; }
  if (voice.framed) return say('Download is not available here.');
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); say('PDF saved.');
}
$('#pdf').onclick = makePdf;
let confirmNew = 0;
$('#new').onclick = () => {
  if (Date.now() - confirmNew > 3000) { confirmNew = Date.now(); $('#new').textContent = 'Tap again to clear'; setTimeout(() => { $('#new').textContent = 'New sheet'; }, 3000); return; }
  doc = blank(); closeEditor(); render(); refreshUndo(); $('#new').textContent = 'New sheet'; say('New sheet.');
};

// boot: draw once fonts are ready, redraw on resize
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
render();
(document.fonts?.load ? Promise.all([document.fonts.load('25px Caveat'), document.fonts.load('bold 14px Arial')]) : Promise.resolve()).then(() => render()).catch(() => {});
(async () => {
  if (!window.claude?.use) return;
  try { downloadsFn = await window.claude.use('downloads'); } catch { downloadsFn = null; }
})();
