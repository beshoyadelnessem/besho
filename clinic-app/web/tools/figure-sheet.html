<!doctype html>
<html><head><meta charset="utf-8"><style>
:root { --prop: #D7E6E2; --prop-strong: #B9D2CC; }
body { margin: 0; background: #fff; display: grid; grid-template-columns: repeat(4, 360px); gap: 0; font: 13px sans-serif; }
.c { border: 1px solid #eee; } .c div { text-align: center; }
</style></head><body>
<script type="module">
import { POSES } from '../src/figure/poses.js';
import { drawFigure, blend, lookFor } from '../src/figure/rig.js';
const params = new URLSearchParams(location.search);
const look = lookFor({ gender: params.get('g') || 'male', hijab: params.get('h') === '1', skin: +(params.get('s') || 2), age: +(params.get('a') || 30) });
const t = +(params.get('t') ?? 1);
for (const [name, ex] of Object.entries(POSES)) {
  for (const tt of [0, t]) {
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = `<svg viewBox="${(ex.view||[0,0,720,480]).join(" ")}" width="360" height="240">${ex.props || ''}${drawFigure(blend(ex.A, ex.B, tt), look)}</svg><div>${name} t=${tt}</div>`;
    document.body.appendChild(d);
  }
}
window.done = true;
</script></body></html>
