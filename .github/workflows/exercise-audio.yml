# Records the read-aloud audio of the exercise library with neural voices and
# commits the MP3s and their timing manifest back to the branch.
name: Exercise audio

on:
  push:
    paths:
      - clinic-app/supabase/seed/exercises_acl.json
      - clinic-app/supabase/seed/build_audio.py
      - .github/workflows/exercise-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exercise-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1
      - name: Record
        run: python3 clinic-app/supabase/seed/build_audio.py
      - name: Commit
        run: |
          git add clinic-app/web/public/audio clinic-app/web/src/api/audio-manifest.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record exercise read-aloud audio"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
